<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary-fixed-variant": "#005227", "on-primary": "#ffffff", "tertiary-fixed-dim": "#e2c62d", "on-error": "#ffffff", "on-error-container": "#93000a", "primary-fixed-dim": "#c6c6c6", "on-secondary-container": "#007439", "inverse-surface": "#2f3131", "secondary-container": "#6dfe9c", "primary-container": "#1b1b1b", "on-secondary": "#ffffff", "on-surface": "#1a1c1c", "surface-variant": "#e2e2e2", "secondary-fixed-dim": "#4de082", "surface-tint": "#5e5e5e", "surface-dim": "#dadada", "on-tertiary": "#ffffff", "surface-container-high": "#e8e8e8", "error-container": "#ffdad6", "tertiary-fixed": "#ffe24c", "surface-bright": "#f9f9f9", "inverse-primary": "#c6c6c6", "surface-container-low": "#f3f3f4", "surface-container": "#eeeeee", "error": "#ba1a1a", "tertiary": "#000000", "on-primary-fixed-variant": "#474747", "on-tertiary-fixed": "#211b00", "inverse-on-surface": "#f0f1f1", "on-background": "#1a1c1c", "surface-container-lowest": "#ffffff", "tertiary-container": "#211b00", "on-tertiary-container": "#988300", "primary": "#000000", "on-secondary-fixed": "#00210c", "outline-variant": "#cfc4c5", "on-surface-variant": "#4c4546", "on-tertiary-fixed-variant": "#524600", "background": "#f9f9f9", "primary-fixed": "#e2e2e2", "on-primary-fixed": "#1b1b1b", "outline": "#7e7576", "secondary": "#006d36", "surface": "#f9f9f9", "on-primary-container": "#848484", "surface-container-highest": "#e2e2e2", "secondary-fixed": "#6dfe9c" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "margin": "3rem", "gutter": "1.5rem", "margin-mobile": "1.25rem", "gutter-mobile": "1rem", "space-lg": "1.5rem", "space-md": "1rem" }, "fontFamily": { "headline-xl": [ "Anton" ], "body-md": [ "Plus Jakarta Sans" ], "headline-md": [ "Anton" ], "headline-lg": [ "Anton" ], "label-md": [ "Space Grotesk" ], "label-lg": [ "Space Grotesk" ], "headline-lg-mobile": [ "Anton" ], "body-lg": [ "Plus Jakarta Sans" ], "headline-xl-mobile": [ "Anton" ], "body-sm": [ "Plus Jakarta Sans" ], "label-sm": [ "Space Grotesk" ] }, "fontSize": { "headline-xl": [ "84px", { "lineHeight": "84px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "body-md": [ "16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "500" } ], "headline-md": [ "32px", { "lineHeight": "36px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "headline-lg": [ "56px", { "lineHeight": "60px", "letterSpacing": "0em", "fontWeight": "400" } ], "label-md": [ "12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "700" } ], "label-lg": [ "14px", { "lineHeight": "18px", "letterSpacing": "0.06em", "fontWeight": "700" } ], "headline-lg-mobile": [ "36px", { "lineHeight": "40px", "letterSpacing": "0em", "fontWeight": "400" } ], "body-lg": [ "20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "headline-xl-mobile": [ "48px", { "lineHeight": "50px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "body-sm": [ "14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" } ], "label-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" } ] } } } };</script></head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface antialiased min-h-screen"><header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest"><div class="h-20 max-w-2xl mx-auto px-gutter-mobile md:px-gutter flex items-center justify-between"><a class="font-headline-md text-headline-md uppercase tracking-tight text-primary select-none hover:opacity-80 transition-opacity" data-path="feed" href="#">CatchUp</a><div class="flex items-center gap-space-md"><nav data-active-classes="text-primary font-bold underline"><a aria-current="page" class="uppercase tracking-wider transition-colors text-primary font-bold underline" data-path="privacy" href="#">Privacy</a></nav><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full pt-20 bg-surface-container-lowest"><div class="max-w-2xl mx-auto px-gutter-mobile md:px-gutter py-space-xl"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<div class="w-full max-w-lg bg-surface-container-lowest rounded-3xl p-6 sm:p-10 shadow-[8px_8px_0px_#000000] border-[3px] border-primary transition-all">
<div class="flex flex-col gap-space-lg">
<h1 class="font-headline-md text-headline-md uppercase tracking-tight text-primary m-0 select-none">
        Draft Reply
      </h1>
<div class="w-full border-[3px] border-primary rounded-2xl bg-surface-container-lowest p-space-md focus-within:shadow-[4px_4px_0px_#000000] transition-shadow">
<textarea class="w-full bg-transparent resize-none outline-none font-body-lg text-body-lg text-on-surface leading-relaxed placeholder:text-outline select-text" id="reply-text" rows="4" spellcheck="false">Hey Elena! Just sent over the $45 for the Airbnb via Venmo. Thanks for booking it!</textarea>
</div>
<div class="flex items-center gap-space-sm select-none" id="tone-pills">
<button class="tone-pill px-5 py-2 rounded-full border-[2.5px] border-primary bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg uppercase tracking-wider shadow-[2px_2px_0px_#000000] transition-transform active:translate-x-[2px] active:translate-y-[2px] active:shadow-none" data-tone="polite" type="button">
          Polite
        </button>
<button class="tone-pill px-5 py-2 rounded-full border-[2.5px] border-primary bg-surface-container-lowest text-primary font-label-lg text-label-lg uppercase tracking-wider transition-all hover:bg-surface-container-low active:translate-x-[2px] active:translate-y-[2px]" data-tone="short" type="button">
          Short
        </button>
<button class="tone-pill px-5 py-2 rounded-full border-[2.5px] border-primary bg-surface-container-lowest text-primary font-label-lg text-label-lg uppercase tracking-wider transition-all hover:bg-surface-container-low active:translate-x-[2px] active:translate-y-[2px]" data-tone="formal" type="button">
          Formal
        </button>
</div>
<div class="pt-space-xs">
<button class="w-full py-4 rounded-full bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-widest border-[3px] border-primary shadow-[4px_4px_0px_#000000] hover:bg-neutral-900 transition-all active:translate-x-[4px] active:translate-y-[4px] active:shadow-none flex items-center justify-center gap-2" id="copy-btn" type="button">
<span id="btn-label">Copy</span>
</button>
</div>
</div>
</div>
<script>
    (() => {
      const copyBtn = document.getElementById('copy-btn');
      const btnLabel = document.getElementById('btn-label');
      const textarea = document.getElementById('reply-text');
      const pills = document.querySelectorAll('.tone-pill');

      const toneVariants = {
        polite: "Hey Elena! Just sent over the $45 for the Airbnb via Venmo. Thanks for booking it!",
        short: "Sent $45 on Venmo for the Airbnb. Thanks!",
        formal: "Hello Elena, I have transferred the $45 payment for the Airbnb accommodation via Venmo. Thank you for organizing."
      };

      pills.forEach((pill) => {
        pill.addEventListener('click', () => {
          const tone = pill.getAttribute('data-tone');
          textarea.value = toneVariants[tone] || textarea.value;

          pills.forEach((p) => {
            p.className = 'tone-pill px-5 py-2 rounded-full border-[2.5px] border-primary bg-surface-container-lowest text-primary font-label-lg text-label-lg uppercase tracking-wider transition-all hover:bg-surface-container-low active:translate-x-[2px] active:translate-y-[2px]';
          });

          pill.className = 'tone-pill px-5 py-2 rounded-full border-[2.5px] border-primary bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg uppercase tracking-wider shadow-[2px_2px_0px_#000000] transition-transform active:translate-x-[2px] active:translate-y-[2px] active:shadow-none';
        });
      });

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(textarea.value);
        } catch {
          textarea.select();
          document.execCommand('copy');
        }

        btnLabel.textContent = 'Copied!';
        setTimeout(() => {
          btnLabel.textContent = 'Copy';
        }, 1500);
      });
    })();
  </script>
</div></div></main></body></html>
